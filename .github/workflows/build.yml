name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Icons
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26 $RES/mipmap-*/ic_launcher*.png
          cp -r icons/* $RES/
          ls $RES/mipmap-xxxhdpi
      - run: npx cap sync android
      - name: Build signed release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
            -Pandroid.injected.signing.store.password="firoozeh1234" \
            -Pandroid.injected.signing.key.alias=firoozeh \
            -Pandroid.injected.signing.key.password="firoozeh1234"
      - uses: actions/upload-artifact@v4
        with:
          name: firoozeh-admin-apk
          path: android/app/build/outputs/apk/release/*.apk
