@media(min-width:900px){body.bg-home::before{background-position:center 80%}}
body.bg-home .top h1,body.bg-home .top .sub{text-shadow:0 0 8px rgba(255,255,255,.9)}
body.bg-home h2{display:inline-block;background:rgba(255,255,255,.92);padding:1px 14px;border-radius:20px}
body.bg-home .list{background:rgba(255,255,255,.96)}
body.bg-home .panel{background:rgba(255,255,255,.95)}
#main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:14px 14px 110px}
/* ناوبری */
#nav{position:fixed;bottom:0;right:0;left:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav .ni{display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;padding:4px 0;color:var(--ink2);font-size:11.5px}
#nav .ni svg{width:22px;height:22px}
#nav .ni.on{color:var(--tqd);font-weight:700}
#nav .side-only,#nav .brand{display:none}
#nav .brand img{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
#nav .mic{margin-top:-26px}
#nav .mic i{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;box-shadow:0 0 0 5px var(--bg),0 0 0 7px var(--tq)}
#nav .mic svg{width:26px;height:26px}
@media(min-width:900px){
 #shell{flex-direction:row-reverse}
 #nav{position:sticky;top:0;height:100vh;width:230px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:2px;border-top:0;border-left:1px solid var(--line);padding:18px 12px}
 #nav .brand{display:block;padding:2px 10px 14px}
 #appbar{display:none}
 #nav .ni{flex:none;flex-direction:row;gap:10px;padding:9px 12px;border-radius:10px;font-size:14.5px}
 #nav .ni.on{background:var(--tql)}
 #nav .side-only{display:flex}
 #nav .bar-only{display:none}
 #nav .mic{margin:0 0 10px;order:-1;background:var(--ink);color:#fff;justify-content:center;font-weight:700}
 #nav .mic i{width:auto;height:auto;border-radius:0;background:none;box-shadow:none;display:inline-grid}
 #nav .mic i svg{width:22px;height:22px}
 #main{padding:22px 26px 40px}
}
/* سرتیتر */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
h1{font-size:21px;margin:0;font-weight:800}
h2{font-size:15.5px;margin:20px 0 8px;font-weight:700}
h3{font-size:13.5px;margin:0;color:var(--tqd);font-weight:700;grid-column:1/-1;padding-top:8px;border-top:1px solid var(--line)}
.sub{margin:0;color:var(--ink2);font-size:13px}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.ico svg{width:19px;height:19px}
/* دفتر حساب */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.lr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.lr:last-child{border-bottom:0}
.lr span{color:var(--ink2)}
.lr b{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lr.tot{border-top:2px solid var(--ink);border-bottom:0;margin-top:2px;padding-top:11px}
.lr.tot span{color:var(--ink);font-weight:700}
.lr.tot b{font-size:19px}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--gold)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pair .panel{padding:10px 14px}
.pair small{display:block;color:var(--ink2);font-size:12.5px}
.pair b{font-size:16.5px;font-variant-numeric:tabular-nums}
/* دکمه‌ها */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:10px;background:var(--tq);color:#fff;font-weight:700}
.btn.sec{background:var(--tql);color:var(--tqd)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.dng{background:var(--redl);color:var(--red)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13.5px}
.btn.full{width:100%}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.acts .btn{flex:1;min-width:130px}
/* لیست */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:block;width:100%;text-align:right;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--tql)}
.row.yel{background:var(--goldl);box-shadow:inset -5px 0 0 var(--gold)}
.row.yel:active{background:#f5e4ad}
.row .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .r2{color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r3{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 14px}
.tag{display:inline-block;font-size:11.5px;padding:0 8px;border-radius:20px;background:var(--tql);color:var(--tqd);font-weight:700}
.tag.rent{background:var(--goldl);color:var(--gold)}
.tag.bad{background:var(--redl);color:var(--red)}
.tag.ok{background:var(--greenl);color:var(--green)}
.row{font-weight:600}.row .r2{font-size:15.5px;white-space:normal;color:var(--ink)}.row .r3{font-size:15px;color:var(--ink)}.row .r1{font-size:16.5px}.row .tag{font-size:13px;font-weight:800}.row .sub{font-size:14px}.row .amt{font-size:17px;font-weight:800}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:26px;text-align:center;color:var(--ink2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chip{flex:none;padding:5px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:8px}
.note{background:var(--goldl);border:1px solid #ecd9a2;color:#6d5114;border-radius:10px;padding:9px 12px;margin:10px 0;font-size:13.5px}
.note.blue{background:var(--tql);border-color:#b6e3de;color:var(--tqd)}
button.note{display:block;width:100%;text-align:right}
/* فرم */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.fld{display:flex;flex-direction:column;gap:3px}
.fld.full{grid-column:1/-1}
.fld>span{font-size:13px;color:var(--ink2)}
.fld input,.fld select,.fld textarea,.search:focus{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus,.search:focus{outline:2px solid var(--tq);outline-offset:0;border-color:var(--tq)}
.fld.miss input,.fld.miss select,.fld.miss textarea{background:var(--goldl);border-color:#e3c777}
.fld.miss>span{color:var(--gold);font-weight:700}
.calc{grid-column:1/-1;background:var(--tql);border-radius:10px;padding:9px 12px;color:var(--tqd);font-size:14px}
.hint{grid-column:1/-1;font-size:13px;color:var(--tqd)}
.bar{position:sticky;bottom:78px;display:flex;gap:8px;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.bar .btn{flex:1}
@media(min-width:900px){.bar{bottom:0}}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{color:var(--ink2);font-weight:600;text-align:right;padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 4px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.dt{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}
.dt dt{color:var(--ink2)}.dt dd{margin:0;word-break:break-word}
.dt .mv{color:var(--gold);font-weight:700}
/* مودال */
#overlay{position:fixed;inset:0;background:rgba(16,40,58,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#overlay[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
@media(min-width:700px){#overlay{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin-top:0}
.sheet textarea{width:100%;min-height:110px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);margin:6px 0}
.sheet textarea:focus{outline:2px solid var(--tq);border-color:var(--tq)}
.ex{font-size:12.5px;color:var(--ink2);margin:6px 0 0;padding-right:18px}
.ex li{margin:2px 0}
.rec.on{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.7}}
@media(prefers-reduced-motion:reduce){.rec.on{animation:none}}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:80;max-width:92vw;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none}
#toast.err{background:var(--red)}
#busy{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.55);display:grid;place-items:center}
#busy[hidden]{display:none}
#busy i{width:40px;height:40px;border-radius:50%;border:4px solid var(--tql);border-top-color:var(--tq);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--tqd);font-weight:700;margin-bottom:8px}
.inl{display:flex;gap:8px;align-items:center}
.inl input{flex:1}
:focus-visible{outline:2px solid var(--tq);outline-offset:2px}

.dw{display:flex;gap:6px;align-items:stretch}
.dw input{flex:1;min-width:0}
.dbtn{flex:0 0 44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--tqd);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.dbtn:hover{background:var(--tql)}
#calov{position:absolute;z-index:80;width:280px;box-shadow:0 8px 28px rgba(16,40,58,.28);border-radius:14px}
#calov[hidden]{display:none}
.cal{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;direction:rtl}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.cal-h b{flex:1;text-align:center}
.cal-n{flex:0 0 36px;min-width:36px;min-height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--tqd)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-w{text-align:center;font-size:12px;color:var(--ink2);padding:4px 0}
.cal-d{min-height:34px;border-radius:10px;border:1px solid transparent;background:#f6f9fa;cursor:pointer;font-size:15px}
.cal-d:hover{background:var(--tql)}
.cal-d.t{border-color:var(--tq)}
.cal-d.s{background:var(--tq);color:#fff;font-weight:700}
.cal-f{display:flex;gap:8px;margin-top:10px}
.cal-f .btn{flex:1}
.cwrap{display:flex;align-items:flex-end;gap:6px;height:150px;overflow-x:auto;padding-top:6px}
.ccol{flex:none;width:34px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.cbars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.cbar{width:12px;border-radius:4px 4px 0 0}
.cbar.sale{background:var(--tq)}.cbar.rent{background:var(--gold)}
.ccol small{font-size:10.5px;color:var(--ink2);white-space:nowrap}
</style>
</head>

function jDiv(a, b) { return ~~(a / b); }

var J_BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

    seen[k] = 1; out.push(n);

  return out;
}

    findContracts: function (q, kind) {
      var toks = searchTokens(q), out = C.contracts.filter(function (c) {
        if (kind && c.kind !== kind) return false;
        return toks.every(function (w) {
          if (/^\d+$/.test(w)) return cKey(w) === cKey(c.number) || (' ' + normText(c.address || '') + ' ').indexOf(' ' + w + ' ') >= 0;
          return normText([c.p1Name, c.p2Name, c.address, c.consultant, c.number].join(' ')).indexOf(w) >= 0;
        });
      });
      out.sort(function (a, b) { return dateNum(b.date) - dateNum(a.date); });
      return { total: out.length, list: out.slice(0, 15).map(function (c) { return { kind: c.kind, number: c.number }; }) };
    },
    findContract: function (k) { var c = C.byKey[k]; return c ? { kind: c.kind, number: c.number } : null; }
  };
}
function openVoice() {
  openModal('<h2>ثبت صوتی یا متنی</h2><p class="sub">متن را بگو یا بنویس. روی گوشی از میکروفون کیبورد (Google) استفاده کن؛ روی ویندوز کلیدهای Win+H.</p>' +
    '<textarea id="vtext" placeholder="مثلاً: دریافت کمیسیون ۵ میلیون تومان قرارداد ۵۰۵۲۳ به حساب دفتر"></textarea>' +
    '<div class="acts"><button class="btn rec" id="recbtn" data-act="rec">🎤 میکروفون برنامه</button><button class="btn" data-act="runVoice">تحلیل و پر کردن فرم</button></div>' +
    '<ul class="ex"><li>دریافت کمیسیون ۵ میلیون قرارداد ۵۰۵۲۳ به حساب دفتر</li><li>پرداخت به مشاور ۳ میلیون قرارداد ۵۰۵۲۳</li><li>هزینه ۲ میلیون بابت قبض برق از حساب بانک</li>' +
    '<li>قرارداد اجاره شماره ۵۰۵۲۴ موجر … تلفن … کمیسیون موجر … مستاجر … کمیسیون مستاجر … مشاور … رهن … اجاره … آدرس … طبقه … آسانسور دارد</li><li>قرارداد فروش شماره ۶۰۱ فروشنده … خریدار … ثمن … سال ساخت …</li><li>ویرایش قرارداد ۶۰۱ ثمن ۴ میلیارد</li><li>هزینه شخصی ۲ میلیون بابت خرید</li></ul>' +
    '<div class="acts"><button class="btn ghost" data-act="closeModal">بستن</button></div>');
  setTimeout(function () { var t = $('#vtext'); if (t) t.focus(); }, 60);
}
function stopRec() { if (REC) { try { REC.stop(); } catch (e) {} REC = null; } var b = $('#recbtn'); if (b) { b.classList.remove('on'); b.textContent = '🎤 میکروفون برنامه'; } }
ACT.rec = function () {
  if (REC) { stopRec(); return; }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('این مرورگر تشخیص صدا ندارد؛ از میکروفون کیبورد استفاده کن', true); return; }
  var base = $('#vtext').value, rec = new SR();
  rec.lang = 'fa-IR'; rec.interimResults = true; rec.continuous = false;
  rec.onresult = function (e) { var t = ''; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; $('#vtext').value = (base ? base + ' ' : '') + t; };
  rec.onerror = function (e) { toast('میکروفون برنامه کار نکرد (' + e.error + ') — از میکروفون کیبورد استفاده کن', true); stopRec(); };
  rec.onend = function () { stopRec(); };
  try { rec.start(); REC = rec; var b = $('#recbtn'); b.classList.add('on'); b.textContent = '■ در حال شنیدن… (توقف)'; } catch (x) { toast('میکروفون برنامه در دسترس نیست — از میکروفون کیبورد استفاده کن', true); }
};
function openTxEdit(row, fields) {

ACT.voicePick = function (el) {

ACT.runVoice = function () {
  var r = parseVoice($('#vtext').value, voiceCtx());
  if (r.intent === 'none') { toast('نوع ثبت مشخص نیست. با «قرارداد فروش»، «قرارداد اجاره»، «دریافت»، «پرداخت به مشاور» یا «هزینه» شروع کن', true); return; }
  if (r.intent === 'contract-kind') { toast('نوع قرارداد را بگو: فروش یا اجاره', true); return; }
  if (r.intent === 'edit-missing') { toast('قراردادی با شماره ' + r.number + ' پیدا نشد', true); return; }
  if (r.intent === 'txedit-none') { toast('تراکنشی پیدا نشد', true); return; }
  if (r.intent === 'txedit-pick') {
    if (r.rows.length === 1) { openTxEdit(r.rows[0], r.fields); return; }
    PENDING_VOICE = { fields: r.fields };
    var th = '<h2>کدام تراکنش؟</h2><p class="sub">جدیدترین‌ها بالاست (حداکثر ۱۵ مورد)</p>';
    r.rows.forEach(function (rw) {
      var t = S.tx.filter(function (x) { return x.row === rw; })[0];
      th += '<button class="btn sec" style="width:100%;text-align:right;margin-bottom:6px" data-act="voicePickTx" data-r="' + rw + '">' + esc(t.type) + ' — ' + fa(esc(String(t.amount))) + ' — ' + fa(esc(t.date || '')) + (t.contract ? ' — قرارداد ' + fa(esc(t.contract)) : '') + '</button>';
    });
    openModal(th + '<div class="acts"><button class="btn ghost" data-act="closeModal">بستن</button></div>');
    return;
  }
  if (r.intent === 'edit-none') { toast('قراردادی با این مشخصات پیدا نشد', true); return; }
  if (r.intent === 'edit-pick') {
    var vc = voiceCtx();
    if (r.items.length === 1 && r.total === 1) { r = contractEditResult(C.byKey[cKey(r.items[0].number)], r.rest, r.hasNumber, vc); }
    else {
      PENDING_VOICE = { rest: r.rest, hasNumber: r.hasNumber };
      var h = '<h2>کدام قرارداد؟</h2>' + (r.total > r.items.length ? '<p class="sub">' + r.total + ' مورد پیدا شد؛ ۱۵ مورد اول (جدیدترین) نمایش داده می‌شود. برای محدود کردن، نام یا شماره را دقیق‌تر بگو.</p>' : '');
      r.items.forEach(function (it) {
        var c = C.byKey[cKey(it.number)];
        h += '<button class="btn sec" style="width:100%;text-align:right;margin-bottom:6px" data-act="voicePick" data-k="' + esc(c.key) + '">' + (c.kind === 'rent' ? 'اجاره' : 'فروش') + ' ' + esc(c.number) + ' — ' + esc(c.p1Name || '') + ' / ' + esc(c.p2Name || '') + ' — ' + esc(c.date || '') + '</button>';
      });
      openModal(h + '<div class="acts"><button class="btn ghost" data-act="closeModal">بستن</button></div>');
      return;
    }
  }
  closeModal();
  if (r.intent === 'contract') go('cform', { kind: r.kind, pre: r.fields, missing: r.missing, fromVoice: true });
  else if (r.intent === 'edit') { var c = C.byKey[cKey(r.number)]; var pre = Object.assign(contractToForm(c), r.fields); go('cform', { kind: c.kind, edit: c.number, pre: pre, fromVoice: true, old: { p1: c.p1Comm, p2: c.p2Comm } }); }
  else if (r.intent === 'tx') go('tform', { pre: r.fields, missing: r.missing, fromVoice: true });
  else if (r.intent === 'personal') go('pform', { pre: r.fields, missing: r.missing, fromVoice: true });
};

/* ---- تقویم شمسی ---- */
var CAL = { k: '', y: 0, m: 0, sel: '' };
var CAL_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var CAL_WD = ['ش','ی','د','س','چ','پ','ج'];
function j2d(jy, jm, jd) {
  var r = jalCal(jy, true);
  return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - jDiv(jm, 7) * (jm - 7) + jd - 1;
}
function calLen(y, m) {
  if (m <= 6) return 31;
  if (m <= 11) return 30;
  return j2d(y + 1, 1, 1) - j2d(y, 12, 1);
}
function calDraw() {
  var ov = $('#calov');
  if (!ov) { ov = document.createElement('div'); ov.id = 'calov'; document.body.appendChild(ov); }
  var first = (j2d(CAL.y, CAL.m, 1) + 2) % 7, len = calLen(CAL.y, CAL.m), td = todayJalali(), i, h = '';
  h += '<div class="cal"><div class="cal-h"><button type="button" class="cal-n" data-act="calYear" data-d="-1" aria-label="سال قبل"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button><b>' + fa(CAL.y) + '</b><button type="button" class="cal-n" data-act="calYear" data-d="1" aria-label="سال بعد"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg></button></div>';
  h += '<div class="cal-h"><button type="button" class="cal-n" data-act="calNav" data-d="-1" aria-label="ماه قبل"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button><b>' + CAL_MONTHS[CAL.m - 1] + ' (' + fa(CAL.m) + ')</b><button type="button" class="cal-n" data-act="calNav" data-d="1" aria-label="ماه بعد"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg></button></div>';
  h += '<div class="cal-g">';
  for (i = 0; i < 7; i++) h += '<div class="cal-w">' + CAL_WD[i] + '</div>';
  for (i = 0; i < first; i++) h += '<div></div>';
  for (i = 1; i <= len; i++) {
    var ds = CAL.y + '/' + pad2(CAL.m) + '/' + pad2(i);
    h += '<button type="button" class="cal-d' + (ds === td ? ' t' : '') + (ds === CAL.sel ? ' s' : '') + '" data-act="calPick" data-v="' + ds + '">' + fa(i) + '</button>';
  }
  h += '</div><div class="cal-f"><button type="button" class="btn" data-act="calToday">امروز</button><button type="button" class="btn ghost" data-act="calClose">بستن</button></div></div>';
  ov.innerHTML = h; ov.hidden = false;
  var a = CAL.a;
  if (a) {
    var r = a.getBoundingClientRect(), sx = window.pageXOffset, sy = window.pageYOffset, w = 280, vw = document.documentElement.clientWidth;
    var left = Math.min(Math.max(r.left + sx, sx + 4), sx + vw - w - 4);
    var top = r.bottom + sy + 4;
    if (r.bottom + 4 + ov.offsetHeight > window.innerHeight && r.top - 4 - ov.offsetHeight > 0) top = r.top + sy - 4 - ov.offsetHeight;
    ov.style.left = left + 'px'; ov.style.top = top + 'px';
  }
}
function calClose() { var ov = $('#calov'); if (ov) { ov.hidden = true; ov.innerHTML = ''; } }
function calSet(v) {
  var e = $('#f_' + CAL.k);
  if (e) { e.value = v; e.dispatchEvent(new Event('input', { bubbles: true })); e.dispatchEvent(new Event('change', { bubbles: true })); }
  calClose();
}
ACT.calOpen = function (el) {
  CAL.k = el.dataset.k; CAL.a = el;
  var cur = normDate(gv(CAL.k)), base = cur || normDate(todayJalali()), p = base.split('/');
  CAL.sel = cur; CAL.y = +p[0]; CAL.m = +p[1];
  calDraw();
};
ACT.calNav = function (el) {
  CAL.m += +el.dataset.d;
  if (CAL.m > 12) { CAL.m = 1; CAL.y++; }
  if (CAL.m < 1) { CAL.m = 12; CAL.y--; }
  calDraw();
};
ACT.calYear = function (el) { CAL.y += +el.dataset.d; calDraw(); };
ACT.calPick = function (el) { calSet(el.dataset.v); };
ACT.calToday = function () { calSet(todayJalali()); };
ACT.calClose = calClose;

document.addEventListener('click', function (e) {
  var ov = $('#calov');
  if (ov && !ov.hidden && !e.target.closest('#calov') && !e.target.closest('.dbtn')) calClose();
});
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACT[el.dataset.act];
  if (fn) fn(el);

document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.money) { var raw = normDigits(t.value).trim(); if (t.dataset.exempt && /^[.\-–−]$/.test(raw)) t.value = '.'; else { var d = raw.replace(/[^\d]/g, ''); t.value = d ? fa(Number(d).toLocaleString('en-US')) : ''; } }
  if (t.id === 'cq') { V.p.q = t.value; clearTimeout(SEARCH_T); SEARCH_T = setTimeout(function () { var pos = t.selectionStart; render(); var n = $('#cq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
  if (t.id === 'tq') { V.p.q = t.value; clearTimeout(SEARCH_T); SEARCH_T = setTimeout(function () { var pos = t.selectionStart; render(); var n = $('#tq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
  if (V.name === 'cform' && /^f_(p1Comm|p2Comm|sharePct|consultant)$/.test(t.id)) calcPreview();
  if (V.name === 'tform' && t.id === 'f_contract') contractHint(true);
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (V.name === 'tform' && t.id === 'f_type') { txTypeChanged(); contractHint(true); }
  if (V.name === 'tform' && t.id === 'f_contract') contractHint(true);
  if (V.name === 'cform' && t.id === 'f_consultant') calcPreview();
});
window.addEventListener('DOMContentLoaded', load);
